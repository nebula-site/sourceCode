<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Craft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- VISUAL STYLES (Unchanged for pixel-perfect look) --- */
        :root {
            --sidebar-width: 305px;
            --border-color: #c8c8c8;
            --bg-color: #ffffff;
            --element-bg: #ffffff;
            --hover-border: #919191;
            --text-color: #1a1a1a;
            --shadow-color: rgba(0, 0, 0, 0.06);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- Top Bar (NEAL.FUN) --- */
        .neal-fun-header {
            background-color: #000;
            color: #fff;
            padding: 0 16px;
            height: 38px;
            display: flex;
            align-items: center;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
            z-index: 100;
            font-family: 'Verdana', sans-serif;
        }

        /* --- Main Container --- */
        .game-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 38px);
        }

        /* Left Canvas */
        .canvas-area {
            flex: 1;
            position: relative;
            background-color: #fff;
            overflow: hidden;
            cursor: default;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .game-logo {
            position: absolute;
            top: 12px;
            right: 18px;
            text-align: right;
            z-index: 10;
            pointer-events: none;
        }

        .logo-text {
            font-size: 24px;
            color: #1a1a1a;
            line-height: 1.1;
        }

        .logo-infinite {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-weight: 400;
        }

        .logo-craft {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 600;
        }

        /* Bottom Controls (Canvas) */
        .canvas-controls-left {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 10;
        }
        
        /* HIDDEN: Removing the Menu button as requested */
        .control-btn {
            display: none !important; 
        }

        .canvas-controls-right {
            position: absolute;
            bottom: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            gap: 12px;
        }

        .control-icon-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .control-icon-btn:hover { opacity: 1; }


        /* --- Right Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: #fbfbfb;
            border-left: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: -2px 0 5px rgba(0,0,0,0.02);
        }
        
        /* Drag-Over/Delete Feedback */
        .sidebar.delete-target {
            background-color: #ffeaea; /* Light red/pink to indicate deletion zone */
        }

        /* Initial Elements (Water, Fire, etc) */
        .pinned-elements {
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #fbfbfb;
        }

        /* Instruction text */
        .instruction-bar {
            margin: 0 12px 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            color: #555;
            background: #fff;
            font-weight: 500;
        }

        /* Scrollable List */
        .element-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px 12px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
        }

        /* Sidebar Footer (Simplified) */
        .sidebar-footer {
            background: #fbfbfb;
            border-top: 1px solid #e5e5e5;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* HIDDEN: Removing the Discoveries/Time tabs as requested */
        .footer-tabs {
            display: none !important;
        }

        .search-area {
            padding: 12px; /* Adjusted padding since tabs are gone */
            position: relative;
        }

        .search-input-wrapper {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 14px;
        }

        .search-input {
            width: 100%;
            padding: 8px 10px 8px 32px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            color: #555;
        }
        .search-input::placeholder { color: #aaa; }


        /* --- The Element Item Style (The "Card") --- */
        .item {
            display: inline-flex;
            align-items: center;
            background: var(--element-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 7px 10px 7px 8px;
            font-size: 15px;
            cursor: grab;
            user-select: none;
            box-shadow: 0 2px 4px var(--shadow-color);
            transition: all 0.1s ease;
            position: relative;
            z-index: 2;
            height: 22px;
            white-space: nowrap;
        }

        .item:hover {
            border-color: var(--hover-border);
            background: #f9f9f9;
        }
        
        .item.on-canvas {
            position: absolute;
            z-index: 50;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }
        
        .item.on-canvas:active {
            cursor: grabbing;
        }

        .item.dragging {
            opacity: 0.8;
            z-index: 1000;
        }
        
        .item-emoji {
            font-size: 1.3em;
            margin-right: 6px;
            line-height: 1;
        }
        
        .item-text {
            font-weight: 500;
            color: #111;
            line-height: 1;
            margin-top: 2px;
        }
        
        .collision-highlight {
            border-color: #2b6cb0;
            box-shadow: 0 0 0 2px rgba(43, 108, 176, 0.2);
        }

        /* --- Loading Bar --- */
        .loading-line {
            position: fixed;
            top: 38px; 
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            width: 0%;
            transition: width 0.2s;
            z-index: 200;
        }

    </style>
</head>
<body>


    <div class="loading-line" id="loadingLine"></div>

    <div class="game-container">
        
        <div class="canvas-area" id="craftCanvas">
            
            <canvas id="bgCanvas"></canvas>

            <div class="game-logo">
                <div class="logo-text">
                    <span class="logo-infinite">Infinite</span> <br>
                    <span class="logo-craft">Craft</span>
                </div>
            </div>

            <div class="canvas-controls-left">
                <button class="control-btn">
                    <i class="fa-solid fa-bars"></i> Menu
                </button>
            </div>

            <div class="canvas-controls-right">
                <button class="control-icon-btn"><i class="fa-solid fa-moon"></i></button>
                <button class="control-icon-btn" id="clearBtn" title="Clear Canvas"><i class="fa-solid fa-broom"></i></button>
                <button class="control-icon-btn" id="volumeBtn" title="Toggle Sound"><i class="fa-solid fa-volume-high"></i></button>
            </div>
            
        </div>

        <div class="sidebar" id="sidebar">
            
            <div class="pinned-elements" id="pinnedElements">
                </div>

            <div class="instruction-bar">
                <i class="fa-solid fa-arrow-left-long"></i> Drag elements to craft
            </div>

            <div class="element-list" id="elementList">
                </div>

            <div class="sidebar-footer">
                
                <div class="search-area">
                    <div class="search-input-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="searchInput" class="search-input" placeholder="Search (4) items...">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://apifreellm.com/apifree.min.js"></script>

    <script>
        // --- 1. CONFIG & STATE ---
        // IMPORTANT: apifree.init('YOUR_API_KEY'); 

        const INITIAL_ELEMENTS = [
            { name: 'Water', emoji: '💧' },
            { name: 'Fire', emoji: '🔥' },
            { name: 'Wind', emoji: '💨' },
            { name: 'Earth', emoji: '🌍' }
        ];

        let state = {
            discovered: [], // Array of {name, emoji}
            canvasItems: [], // Array of {id, name, emoji, x, y}
            isMuted: false,
        };

        // DOM Elements
        const canvasArea = document.getElementById('craftCanvas');
        const elementList = document.getElementById('elementList');
        const pinnedElements = document.getElementById('pinnedElements');
        const sidebar = document.getElementById('sidebar');
        const searchInput = document.getElementById('searchInput');
        const loadingLine = document.getElementById('loadingLine');
        const volumeBtn = document.getElementById('volumeBtn');
        const clearBtn = document.getElementById('clearBtn');

        // --- 2. LOCAL STORAGE ---
        function loadState() {
            const saved = localStorage.getItem('infiniteCraftState_v2');
            if (saved) {
                const loadedState = JSON.parse(saved);
                state.discovered = loadedState.discovered || [];
                state.canvasItems = loadedState.canvasItems || [];
                state.isMuted = loadedState.isMuted || false;
            } else {
                state.discovered = [];
                state.canvasItems = [];
                state.isMuted = false;
            }
            updateVolumeIcon();
            renderSidebar();
            renderCanvas();
        }

        function saveState() {
            // Save canvas items position
            const items = Array.from(document.querySelectorAll('.item.on-canvas'));
            state.canvasItems = items.map(el => ({
                id: el.dataset.id,
                name: el.dataset.name,
                emoji: el.dataset.emoji,
                x: parseFloat(el.style.left),
                y: parseFloat(el.style.top)
            }));
            
            localStorage.setItem('infiniteCraftState_v2', JSON.stringify(state));
        }

        // --- 3. RENDERING & UI CONTROL ---

        function createItemDOM(name, emoji, isCanvas = false, id = null) {
            const div = document.createElement('div');
            div.className = `item ${isCanvas ? 'on-canvas' : ''}`;
            div.draggable = true;
            div.dataset.name = name;
            div.dataset.emoji = emoji;
            if (id) div.dataset.id = id;
            
            div.innerHTML = `<span class="item-emoji">${emoji}</span><span class="item-text">${name}</span>`;
            
            // Drag Events
            div.addEventListener('dragstart', handleDragStart);
            div.addEventListener('dragend', handleDragEnd);

            return div;
        }

        function renderSidebar() {
            // 1. Render Pinned (Starter)
            pinnedElements.innerHTML = '';
            INITIAL_ELEMENTS.forEach(el => {
                const node = createItemDOM(el.name, el.emoji);
                pinnedElements.appendChild(node);
            });

            // 2. Render Discovered List
            elementList.innerHTML = '';
            const filter = searchInput.value.toLowerCase();
            
            const allItems = [...state.discovered].sort((a, b) => a.name.localeCompare(b.name));

            allItems.forEach(el => {
                if (el.name.toLowerCase().includes(filter)) {
                    const node = createItemDOM(el.name, el.emoji);
                    elementList.appendChild(node);
                }
            });
            
            // Update search placeholder
            const total = allItems.length + INITIAL_ELEMENTS.length;
            searchInput.placeholder = `Search (${total}) items...`;
        }

        function renderCanvas() {
            // Remove existing canvas items
            document.querySelectorAll('.item.on-canvas').forEach(e => e.remove());

            state.canvasItems.forEach(item => {
                const node = createItemDOM(item.name, item.emoji, true, item.id);
                node.style.left = `${item.x}px`;
                node.style.top = `${item.y}px`;
                canvasArea.appendChild(node);
            });
        }

        function clearCanvas() {
            state.canvasItems = [];
            renderCanvas();
            saveState();
        }
        
        function updateVolumeIcon() {
            volumeBtn.innerHTML = state.isMuted 
                ? '<i class="fa-solid fa-volume-xmark"></i>'
                : '<i class="fa-solid fa-volume-high"></i>';
        }
        
        // --- 4. DRAG & DROP LOGIC ---
        
        let dragSource = null;
        let dragOffset = { x: 0, y: 0 };
        let dragFromSidebar = false;

        function handleDragStart(e) {
            dragSource = this;
            const rect = this.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            
            dragFromSidebar = !this.classList.contains('on-canvas');
            
            e.dataTransfer.effectAllowed = 'copyMove';
            e.dataTransfer.setData('application/json', JSON.stringify({
                name: this.dataset.name,
                emoji: this.dataset.emoji
            }));

            setTimeout(() => this.classList.add('dragging'), 0);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.collision-highlight').forEach(el => el.classList.remove('collision-highlight'));
            sidebar.classList.remove('delete-target');
            dragSource = null;
        }

        // --- Sidebar Drag-to-Delete Logic ---

        sidebar.addEventListener('dragover', (e) => {
            e.preventDefault();
            const draggingEl = document.querySelector('.dragging');
            if (draggingEl && draggingEl.classList.contains('on-canvas')) {
                e.dataTransfer.dropEffect = 'move';
                sidebar.classList.add('delete-target');
            } else {
                e.dataTransfer.dropEffect = 'none';
            }
        });

        sidebar.addEventListener('dragleave', (e) => {
            // Ensure we only remove the class if the drag leaves the sidebar entirely
            if (!sidebar.contains(e.relatedTarget) && document.querySelector('.dragging')) {
                sidebar.classList.remove('delete-target');
            }
        });

        sidebar.addEventListener('drop', (e) => {
            e.preventDefault();
            sidebar.classList.remove('delete-target');
            const draggingEl = document.querySelector('.dragging');

            if (draggingEl && draggingEl.classList.contains('on-canvas')) {
                // Delete the canvas element
                const idToDelete = draggingEl.dataset.id;
                
                draggingEl.remove();
                state.canvasItems = state.canvasItems.filter(i => i.id !== idToDelete);
                saveState();
            }
        });

        // --- Canvas Drop Zone ---
        canvasArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            const draggingEl = document.querySelector('.dragging');
            if (!draggingEl) return;

            // Collision Highlighting logic
            const candidates = document.querySelectorAll('.item.on-canvas:not(.dragging)');
            let hovered = null;
            
            candidates.forEach(target => {
                target.classList.remove('collision-highlight');
                const tRect = target.getBoundingClientRect();
                const dist = Math.hypot(e.clientX - (tRect.left + tRect.width/2), e.clientY - (tRect.top + tRect.height/2));
                
                if (dist < 50) {
                    hovered = target;
                }
            });

            if (hovered) {
                hovered.classList.add('collision-highlight');
            }
        });

        canvasArea.addEventListener('drop', async (e) => {
            e.preventDefault();
            const draggingEl = document.querySelector('.dragging');
            if (!draggingEl) return;

            const dataStr = e.dataTransfer.getData('application/json');
            if (!dataStr) return; // Should not happen if dragstart set the data correctly
            const data = JSON.parse(dataStr);

            const canvasRect = canvasArea.getBoundingClientRect();
            
            // Determine Drop Position
            let x = e.clientX - canvasRect.left - dragOffset.x;
            let y = e.clientY - canvasRect.top - dragOffset.y;

            const target = document.querySelector('.collision-highlight');
            
            if (target) {
                // *** COMBINATION LOGIC ***
                const name1 = target.dataset.name;
                const name2 = data.name;
                
                // Remove the target
                const targetId = target.dataset.id;
                target.remove();
                state.canvasItems = state.canvasItems.filter(i => i.id !== targetId);

                // Remove the source if it was from the canvas
                if (!dragFromSidebar && dragSource) {
                    const sourceId = dragSource.dataset.id;
                    dragSource.remove();
                    state.canvasItems = state.canvasItems.filter(i => i.id !== sourceId);
                }

                await combineElements(name1, name2, x, y);

            } else {
                // *** PLACEMENT LOGIC ***
                
                if (!dragFromSidebar && dragSource) {
                    // Update position for existing canvas item
                    dragSource.style.left = `${x}px`;
                    dragSource.style.top = `${y}px`;
                    
                    const item = state.canvasItems.find(i => i.id === dragSource.dataset.id);
                    if (item) { item.x = x; item.y = y; }
                    
                } else {
                    // Create new item from sidebar
                    const newItem = {
                        id: 'item-' + Date.now() + Math.random().toString(36).substring(2, 9),
                        name: data.name,
                        emoji: data.emoji,
                        x: x,
                        y: y
                    };
                    state.canvasItems.push(newItem);
                    
                    const node = createItemDOM(newItem.name, newItem.emoji, true, newItem.id);
                    node.style.left = `${x}px`;
                    node.style.top = `${y}px`;
                    canvasArea.appendChild(node);
                }
            }
            
            saveState();
        });


        // --- 5. API COMBINATION ---
        async function combineElements(name1, name2, x, y) {
            loadingLine.style.width = '70%';
            
            const prompt = `Combine "${name1}" and "${name2}" into a new single element for an alchemy game. Result must be creative but logical. Return strictly JSON: {"name": "Result Name", "emoji": "😃"}`;
            
            try {
                const response = await apifree.chat(prompt);
                
                let result = { name: "Nothing", emoji: "💨" };
                try {
                    const jsonStr = response.replace(/```json|```/g, '').trim();
                    result = JSON.parse(jsonStr);
                } catch(e) {
                    const n = response.match(/"name":\s*"([^"]+)"/);
                    const em = response.match(/"emoji":\s*"([^"]+)"/);
                    if(n) result.name = n[1];
                    if(em) result.emoji = em[1];
                }

                const isNew = !state.discovered.some(d => d.name === result.name) && 
                              !INITIAL_ELEMENTS.some(i => i.name === result.name);
                
                if (isNew) {
                    state.discovered.push(result);
                    renderSidebar();
                }

                // Add result to canvas
                const newItem = {
                    id: 'crafted-' + Date.now() + Math.random().toString(36).substring(2, 9),
                    name: result.name,
                    emoji: result.emoji,
                    x: x,
                    y: y
                };
                state.canvasItems.push(newItem);
                
                const node = createItemDOM(newItem.name, newItem.emoji, true, newItem.id);
                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
                canvasArea.appendChild(node);
                
                node.animate([
                    { transform: 'scale(0.5)', opacity: 0 },
                    { transform: 'scale(1.1)', opacity: 1 },
                    { transform: 'scale(1)', opacity: 1 }
                ], { duration: 400, easing: 'ease-out' });

            } catch (err) {
                console.error("Crafting failed", err);
            } finally {
                loadingLine.style.width = '0%';
            }
        }

        // --- 6. BACKGROUND ANIMATION (The "Nodes") ---
        const bgCanvas = document.getElementById('bgCanvas');
        const ctx = bgCanvas.getContext('2d');
        let width, height;
        let nodes = [];

        function resize() {
            width = canvasArea.offsetWidth;
            height = canvasArea.offsetHeight;
            ctx.canvas.width = width;
            ctx.canvas.height = height;
            initNodes();
        }
        
        function initNodes() {
            nodes = [];
            const count = Math.floor((width * height) / 25000); 
            for(let i=0; i<count; i++) {
                nodes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2
                });
            }
        }

        function drawNodes() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#e0e0e0';
            ctx.strokeStyle = '#f0f0f0';
            
            nodes.forEach((node, i) => {
                node.x += node.vx;
                node.y += node.vy;
                
                if(node.x < 0 || node.x > width) node.vx *= -1;
                if(node.y < 0 || node.y > height) node.vy *= -1;

                // Draw Dot
                ctx.beginPath();
                ctx.arc(node.x, node.y, 1.5, 0, Math.PI*2);
                ctx.fill();

                // Draw Lines
                for(let j=i+1; j<nodes.length; j++) {
                    const other = nodes[j];
                    const dist = Math.hypot(node.x - other.x, node.y - other.y);
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(node.x, node.y);
                        ctx.lineTo(other.x, other.y);
                        ctx.lineWidth = (1 - (dist/150)) * 0.5;
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(drawNodes);
        }

        // --- 7. EVENT HANDLERS ---
        
        // Volume Toggle
        volumeBtn.addEventListener('click', () => {
            state.isMuted = !state.isMuted;
            updateVolumeIcon();
            saveState();
        });
        
        // Clear Canvas Button
        clearBtn.addEventListener('click', clearCanvas);

        // Search Filter
        searchInput.addEventListener('input', renderSidebar);


        // --- INIT ---
        window.addEventListener('resize', resize);
        document.addEventListener('DOMContentLoaded', () => {
            resize();
            drawNodes();
            loadState();
        });
        
    </script>
</body>
</html>
